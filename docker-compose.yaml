services:
  db:
    image: postgres:18.1-alpine3.22
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 7
      start_period: 10s
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    restart: always
    env_file:
      - .service.env/server.env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 7
      start_period: 10s
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent
    restart: always
    env_file:
      - .service.env/agent.env
    depends_on:
      server:
        condition: service_healthy
